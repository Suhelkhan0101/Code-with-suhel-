<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mansun Weather</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="weather-container">
    <h1 class="app-title">Mansun Weather</h1>
    
    <div class="weather-card">
      <h2 class="city-name">São Paulo</h2>
      <div class="weather-icon">
        <img src="https://openweathermap.org/img/wn/01d@2x.png" alt="Sunny" />
      </div>
      <p class="temperature">27°C</p>
      <p class="weather-description">Ensolarado</p>
    </div>
  </div>
</body>
</html>
